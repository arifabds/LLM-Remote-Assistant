syntax = "proto3";

package orchestrator;
option go_package = "llm-remote-assistant/gateway/protos";

message ProcessRequest {
  string clientId = 1;
  string messageJson = 2; 
}

message ProcessResponse {
  string status = 1;
  string message = 2;
}

message ConfirmationRequest {
  string clientId = 1;
  bool approved = 2;
  string intent = 3;
}

message ConfirmationResponse {
  string status = 1;
}


service OrchestratorService {
  rpc ProcessCommand(ProcessRequest) returns (ProcessResponse) {}

  rpc HandleConfirmation(ConfirmationRequest) returns (ConfirmationResponse) {}
}