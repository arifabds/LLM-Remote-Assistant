events {}

http {
    upstream gateway_go {
        server gateway-go:8080;
    }

    upstream orchestrator_py {
        server orchestrator-py:50051;
    }

    upstream identity_java {
        server identity-java:8080;
    }

    server {
        listen 80;

        location /ws {
            proxy_pass http://gateway_go;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            
            proxy_read_timeout 7d;
            proxy_send_timeout 7d;
            proxy_connect_timeout 7d;
        }

        # location /api/v1 {
        #     proxy_pass http://orchestrator_py_http; # Ayrı bir HTTP upstream gerekirdi
        # }
        
        location /api/auth {
            proxy_pass http://identity_java;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/devices {
            proxy_pass http://identity_java;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}