version: "3.8"

services:
  postgres-db: 
    image: postgres:15
    container_name: postgres-db
    environment:
      POSTGRES_USER: llm_user
      POSTGRES_PASSWORD: llm_password
      POSTGRES_DB: llm_identity_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - llm-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llm_user -d llm_identity_db"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  identity-java:
    container_name: identity-java
    build:
      context: . 
      dockerfile: ./backend/identity-java/Dockerfile 
    ports:
      - "8081:8080"
    networks:
      - llm-network
    depends_on:
      postgres-db:
        condition: service_healthy

  orchestrator-py:
    container_name: orchestrator-py
    build:
      context: ./backend/orchestrator-py
    volumes:
      - ./backend/orchestrator-py:/app
    expose:
      - "8000"
      - "50051"
    networks:
      - llm-network
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL_NAME=${GROQ_MODEL_NAME}
      - SECURITY_LLM_MODEL_NAME=${SECURITY_LLM_MODEL_NAME}
      - SECURITY_LLM_API_KEY=${SECURITY_LLM_API_KEY}
    healthcheck:
      # --- İŞTE BU, SORUNU KESİN OLARAK ÇÖZECEK OLAN DEĞİŞİKLİK ---
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  gateway-go:
    container_name: gateway-go
    build:
      context: ./backend/gateway-go
    networks:
      - llm-network
    depends_on:
      orchestrator-py:
        condition: service_healthy
      identity-java:
        condition: service_started

  api-gateway:
    container_name: api-gateway
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./backend/api-gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - llm-network
    depends_on:  
      - gateway-go
      - identity-java

networks:
  llm-network:
    driver: bridge

volumes:
  postgres_data: