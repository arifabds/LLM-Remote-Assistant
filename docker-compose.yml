services:
  postgres-db: 
    image: postgres:15
    container_name: postgres-db
    environment:
      POSTGRES_USER: llm_user
      POSTGRES_PASSWORD: llm_password
      POSTGRES_DB: llm_identity_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - llm-network
  
  identity-java:
    container_name: identity-java
    build:
      context: . 
      dockerfile: ./backend/identity-java/Dockerfile 
    ports:
      - "8081:8080"
    networks:
      - llm-network
    depends_on:
      - postgres-db

  orchestrator-py:
    container_name: orchestrator-py
    build:
      context: ./backend/orchestrator-py
    volumes:
      - ./backend/orchestrator-py:/app
    networks:
      - llm-network
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL_NAME=${GROQ_MODEL_NAME}
      - SECURITY_LLM_MODEL_NAME=${SECURITY_LLM_MODEL_NAME}
      - SECURITY_LLM_API_KEY=${SECURITY_LLM_API_KEY}

  gateway-go:
    container_name: gateway-go
    build:
      context: ./backend/gateway-go
    volumes:
      - ./backend/gateway-go:/app
    networks:
      - llm-network

  api-gateway:
    container_name: api-gateway
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./backend/api-gateway/nginx.conf:/etc/nginx/nginx.conf
    networks:
      - llm-network

networks:
  llm-network:
    driver: bridge

volumes:
  postgres_data: